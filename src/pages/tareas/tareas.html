<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect — Tareas</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
  <link rel="stylesheet" href="/src/assets/styles/tokens.css">
  <link rel="stylesheet" href="/src/assets/styles/base.css">
  <link rel="stylesheet" href="/src/assets/styles/components.css">
  <link rel="stylesheet" href="/src/assets/styles/layout.css">
</head>
<body>
  <div class="app-container">
    <aside id="menu"></aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: var(--space-3);">
          <button id="mobile-menu-btn" class="mobile-menu-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-title-wrapper">
            <h2 class="header-title" data-i18n="tareas.title">Tareas & Seguimiento</h2>
            <span class="header-subtitle" data-i18n="tareas.subtitle">Lista de actividades operativas y tareas pendientes de contratación</span>
          </div>
        </div>

        <div class="header-controls">
          <button id="create-tarea-btn" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="tareas.new">Nueva Tarea</span>
          </button>
          <div id="theme-switcher-container"></div>
          <div id="accessibility-menu-container"></div>
          <div id="lang-switcher-container"></div>
        </div>
      </header>

      <main class="content-body">
        <section class="section-banner" aria-labelledby="tareas-visual-title">
          <img class="section-banner-image" src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1400&q=82" alt="Planificación de tareas sobre un escritorio" />
          <div class="section-banner-content">
            <h1 id="tareas-visual-title" data-i18n="tareas.banner.title">Mantén el proceso en movimiento</h1>
            <p data-i18n="tareas.banner.subtitle">Prioriza las acciones que acercan cada contratación.</p>
          </div>
        </section>
        <div id="filter-container"></div>
        <div id="table-container"></div>
        <div id="pagination-container"></div>
      </main>
    </div>
  </div>

  <script type="module" src="./tareas.js"></script>
</body>
</html>
