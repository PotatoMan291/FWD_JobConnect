<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect — Candidatos</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
  <link rel="stylesheet" href="/src/assets/styles/tokens.css">
  <link rel="stylesheet" href="/src/assets/styles/base.css">
  <link rel="stylesheet" href="/src/assets/styles/components.css">
  <link rel="stylesheet" href="/src/assets/styles/layout.css">
</head>
<body>
  <div class="app-container">
    <aside id="menu"></aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: var(--space-3);">
          <button id="mobile-menu-btn" class="mobile-menu-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-title-wrapper">
            <h2 class="header-title" data-i18n="candidatos.title">Gestión de Candidatos</h2>
            <span class="header-subtitle" data-i18n="candidatos.subtitle">Directorio de talentos, perfiles profesionales y datos de contacto</span>
          </div>
        </div>

        <div class="header-controls">
          <div id="theme-switcher-container"></div>
          <div id="accessibility-menu-container"></div>
          <div id="lang-switcher-container"></div>
        </div>
      </header>

      <main class="content-body">
        <section class="section-banner" aria-labelledby="candidatos-visual-title">
          <img class="section-banner-image" src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1400&q=82" alt="Profesionales conversando en un espacio de trabajo" />
          <div class="section-banner-content">
            <h1 id="candidatos-visual-title" data-i18n="candidatos.banner.title">Personas que hacen avanzar tu equipo</h1>
            <p data-i18n="candidatos.banner.subtitle">Explora perfiles, experiencia y disponibilidad.</p>
          </div>
        </section>
        <div id="filter-container"></div>
        <div id="table-container"></div>
        <div id="pagination-container"></div>
      </main>
    </div>
  </div>

  <script type="module" src="./candidatos.js"></script>
</body>
</html>
